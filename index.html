  }
  *{margin:0;padding:0;box-sizing:border-box;}

  /* the one that glows */
  .spine.target{
    border:0; cursor:pointer; width:66px;
    background:linear-gradient(90deg,#3d0a16,#6e1729 38%,#52101f 72%,#2c060e);
    box-shadow:inset -3px 0 5px rgba(0,0,0,.45), inset 2px 0 2px rgba(255,255,255,.12), 0 0 12px rgba(170,36,62,.25);
    animation:glow 4.2s ease-in-out infinite;

  .spine.target .t{ color:#e8d29c; font-style:normal; letter-spacing:.07em; line-height:1.25; text-align:center; text-shadow:0 1px 2px rgba(0,0,0,.85); }
  .spine.target i{ position:absolute; left:10%; right:10%; height:5px; border-top:1px solid var(--gold); border-bottom:1px solid var(--gold); opacity:.85; }

  [data-state=shelf] .spine.target:hover{ transform:translateY(-10px); filter:brightness(1.08); }
  [data-state=pulling] .spine.target, [data-state=cover] .spine.target, [data-state=open] .spine.target{
    transform:translateY(-24px) scale(1.07); filter:brightness(1.06); animation:none;

  @keyframes glow{

  .hint{

  /* ---------- the book ---------- */
  .book-stage{

  .book{

  /* settled = flip finished: same picture, but drawn flat (prevents 3D compositing ghost lines) */

  .bb-right, .bb-left{

  .cover{

  [data-state=open] .cover{ transform:translateZ(3px) rotateY(-180deg); }

  .cover-front, .cover-back{ position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; }
  .cover-front{ transform:translateZ(1px); }
  /* page content stays invisible until the cover has swung past 90° (and the right page until it starts to open) */
  .cover-back .page-inner{ visibility:hidden; transition:visibility 0s; }

  .cover-back{

  .cover-back .leftpage{ top:8px; bottom:8px; left:0; right:9px; border-radius:4px 0 0 4px;

  .cover-front{

    background:

  }
  .cover-front::before{ content:""; position:absolute; inset:6%; border:2px solid var(--gold); opacity:.85; border-radius:2px; }

  /* with real artwork the cover IS the artwork (full bleed), with a hinge shadow on top */
  .c-art{ display:none; position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 50%; border-radius:inherit; }

  .closing{ margin-top:1.3rem; padding-top:.9rem; border-top:1px solid rgba(42,26,23,.2); }
  .closing::before{ content:"❦"; display:block; color:var(--oxblood); font-size:1.3rem; margin-bottom:.3rem; }
  .closing p{ font-style:italic; font-size:clamp(1.1rem,1.8vw,1.35rem); color:var(--ink-soft); line-height:1.6; }
  .closing .kr{ font-family:'Noto Serif KR', serif; font-style:normal; font-size:.9em; color:var(--ink); }
  .sign{ margin-top:.9rem; font-style:italic; font-size:.95rem; color:var(--ink-soft); }
  .sign .crossies{ color:var(--oxblood); }

  /* ---------- narrow: one page, cover swings away ---------- */
  @media (max-width:859px){
    :root{ --bw:min(88vw,430px); --bh:min(calc(var(--vh,1vh)*86),calc(var(--bw)*1.55)); --shift:0%; }
    .bb-right{ width:calc(100% + 9px); }
    .bb-left, .cover-back{ display:none; }
    .rightpage{ width:100%; }
    .cover{ left:0; width:calc(100% + 9px); }
    .scene.settled .cover{ display:none; }
    [data-state=open] .cover{ opacity:0; transition:transform 1.3s cubic-bezier(.45,0,.2,1), opacity .4s .7s; }
    #pageLeft .runhead{ display:none; }
    .sec-left{ flex:none; padding-bottom:1.6rem; }
    .sec-right{ flex:none; border-top:1px solid rgba(42,26,23,.2); padding-top:1.4rem; }
    .backbtn{ margin-left:auto; }
    .hint{ white-space:normal; text-align:center; width:max-content; max-width:86vw; bottom:13vh; }
    .legal{ left:12px; bottom:28px; font-size:.85rem; }
  }
</style>
</head>
<body>

<div class="grain"></div>

<main class="scene" id="scene" data-state="shelf">

  <div class="shelf-wrap"><div class="shelf" id="shelf"></div></div>
  <div class="cover-bg" id="coverBg"></div>
  <p class="hint" id="hint">One of them is glowing. Pull it out.</p>

  <div class="book-stage">
    <div class="book" id="book" role="region" aria-label="Delulu Is My Solulu" tabindex="-1" inert>
      <div class="bb-left"></div>
      <div class="bb-right"></div>

      <div class="page rightpage"><div class="page-inner" id="rightSlot"></div></div>

      <div class="cover">
        <div class="cover-back"><div class="page leftpage"><div class="page-inner" id="leftSlot"></div></div></div>
        <div class="cover-front" aria-hidden="true">
          <div class="groove"></div>
          <img class="c-art" id="coverArt" alt="">
          <div class="c-orn">❦</div>
          <div class="c-title" id="coverTitle"></div>
          <div class="c-kr" id="coverKr"></div>
          <div class="c-foot">XHarmony</div>
        </div>
      </div>
    </div>
  </div>

  <!-- page content (moved into the book by layout()) -->
  <div hidden>
    <section class="sec sec-left" id="pageLeft">
      <div class="runhead"><span>XHarmony</span></div>
      <div class="eyebrow" id="eyebrow"></div>
      <h1 class="title-en" id="titleEn"></h1>
      <div class="title-kr" id="titleKr"></div>
      <p class="tagline" id="tagline"></p>

      <div class="telemetry" id="telemetry" role="timer" aria-live="off" aria-label="Countdown to release">
        <div class="t-unit"><span class="t-num" id="dd">00</span><span class="t-label">days</span></div>
        <span class="t-sep">:</span>
        <div class="t-unit"><span class="t-num" id="hh">00</span><span class="t-label">hours</span></div>
        <span class="t-sep">:</span>
        <div class="t-unit"><span class="t-num" id="mm">00</span><span class="t-label">minutes</span></div>
        <span class="t-sep">:</span>
        <div class="t-unit"><span class="t-num" id="ss">00</span><span class="t-label">seconds</span></div>
      </div>
      <p class="release-line" id="releaseLine"></p>
    </section>

    <section class="sec sec-right" id="pageRight">
      <div class="runhead">
        <span class="kr" id="runKr"></span>
        <button class="backbtn" id="backBtn" type="button">Back to the shelf</button>
      </div>
      <div id="channelsBlock">
        <div class="transmission-label" id="channelsLabel"></div>
        <p class="transmission-note" id="channelsNote"></p>
        <div class="channels" id="channels"></div>
      </div>
      <div class="closing"><p id="closing"></p></div>
      <p class="sign">XHarmony — for <span class="crossies">CROSSIES</span></p>
    </section>
  </div>
</main>

<audio id="bgMusic" loop preload="none">
  <source src="solulu.mp3" type="audio/mpeg">
</audio>
<button id="musicBtn" type="button">Play song</button>
<nav class="legal" aria-label="Legal"><a href="/legal_notice">Legal Notice</a><span>·</span><a href="/privacy">Privacy</a></nav>

<!-- the pull-out spine lives here until buildShelf() places it -->
<button class="spine target" id="pullBtn" type="button" hidden>
  <span class="t" id="spineTitle"></span><i class="b1"></i><i class="b2"></i>
</button>

<script>
// =====================================================
//  CONFIG — the only block you edit per song
// =====================================================
const CONFIG = {
  title:      "Delulu Is My Solulu",
  titleKr:    "환상주의",
  coverImage: "cover.jpg",   // backdrop + plate on the book cover; falls back gracefully if missing
  spineLines: ["Delulu", "Is My Solulu"],   // title on the glowing spine, one entry per line

  eyebrow:    "Next chapter",
  tagline:    "Reality’s a mess —",
  taglineAccent: "but at least my man’s obsessed.",

  // Release moment WITH UTC offset (CET +01:00, CEST +02:00). "" hides the countdown.
  releaseAt:    "2026-11-27T00:00:00+01:00",
  releaseLabel: "27.11 · 00:00",
  releasePrefix: "Chapter drops",
  liveText:     "Out now",
  liveReleaseLine: "Chapter unlocked",

  channelsLabel: "Start reading",
  channelsNote:  "Listen wherever you keep your guilty pleasures. We won’t tell.",
  // an empty url shows the button as "soon" until you fill it in
  links: [
    { label: "Spotify",       url: "https://open.spotify.com/artist/13nWsJLBfziap4JWzTX7gT" },
    { label: "Apple Music",   url: "https://music.apple.com/at/artist/xharmony-%EC%97%91%EC%8A%A4%ED%95%98%EB%AA%A8%EB%8B%88/1869937196" },
    { label: "YouTube",       url: "https://youtube.com/channel/UCHU8SJnX_bgb5ox1axjQNsw" },
    { label: "Hyperfollow",   url: "https://distrokid.com/hyperfollow/xharmony/delulu-?ref=release", primary: true }
  ],

  hint:       "One of them is glowing. Pull it out.",
  // one entry per line; { kr: "..." } is set in the Korean face
  closing: ['You know I’m not real, right?', '…', { kr: '다음 챕터.' }]
};

// =====================================================
//  Setup
// =====================================================
const $ = id => document.getElementById(id);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

function setVh(){ document.documentElement.style.setProperty('--vh', (innerHeight * 0.01) + 'px'); }
setVh();

// ---------- text content ----------
$('titleEn').textContent = CONFIG.title;
$('titleKr').textContent = CONFIG.titleKr;
$('coverTitle').textContent = CONFIG.title;
$('coverKr').textContent = CONFIG.titleKr;

// cover art: backdrop behind the open book + plate on the leather cover
const coverArt = $('coverArt');
function artReady(){
  $('coverBg').style.backgroundImage = 'url("' + CONFIG.coverImage + '")';
  $('scene').classList.add('has-art');
  document.querySelector('.cover-front').classList.add('has-art');
}
coverArt.addEventListener('load', artReady);
coverArt.src = CONFIG.coverImage;
if (coverArt.complete && coverArt.naturalWidth) artReady();
$('runKr').textContent = CONFIG.titleKr;
const spineLines = CONFIG.spineLines || [CONFIG.title];
spineLines.forEach((line, i) => {
  if (i) $('spineTitle').append(document.createElement('br'));
  $('spineTitle').append(line);
});
$('pullBtn').setAttribute('aria-label', 'Pull out “' + CONFIG.title + '”');
$('eyebrow').textContent = CONFIG.eyebrow;
$('hint').textContent = CONFIG.hint;

$('tagline').append('“' + CONFIG.tagline + ' ');
if (CONFIG.taglineAccent) {
  const a = document.createElement('span');
  a.className = 'accent';
  a.textContent = CONFIG.taglineAccent;
  $('tagline').append(a);
}
$('tagline').append('”');

$('channelsLabel').textContent = CONFIG.channelsLabel;
$('channelsNote').textContent = CONFIG.channelsNote;
// only https links are ever rendered as real links
function safeUrl(u){
  try { const x = new URL(u); return x.protocol === 'https:' ? x.href : ''; } catch { return ''; }
}
CONFIG.links.forEach(l => {
  const url = safeUrl(l.url);
  const ready = !!url;
  const a = document.createElement(ready ? 'a' : 'span');
  a.className = 'channel' + (l.primary ? ' channel-primary' : '') + (ready ? '' : ' is-soon');
  if (ready) {
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.referrerPolicy = 'no-referrer';
  } else {
    a.setAttribute('aria-disabled', 'true');
  }
  a.append(l.label + ' ');
  const arrow = document.createElement('span');
  arrow.className = 'arrow';
  arrow.textContent = ready ? '→' : 'soon';
  a.append(arrow);
  $('channels').append(a);
});

CONFIG.closing.forEach((line, i) => {
  if (i) $('closing').append(document.createElement('br'));
  if (typeof line === 'string') {
    $('closing').append(line);
  } else {
    const k = document.createElement('span');
    k.className = 'kr';
    k.textContent = line.kr;
    $('closing').append(k);
  }
});

// ---------- page layout: two pages (wide) or one scrolling page (narrow) ----------
const wide = matchMedia('(min-width: 860px)');
function layout(){
  const left = $('pageLeft'), right = $('pageRight');
  if (wide.matches) {
    $('leftSlot').append(left);
    $('rightSlot').append(right);
  } else {
    $('rightSlot').append(left, right);
  }
}
// shrink a page's content slightly if it would not fit (never clipped or overlapping)
function fitPages(){
  const pairs = [['leftSlot', 'pageLeft'], ['rightSlot', 'pageRight']];
  pairs.forEach(([slot, sec]) => {
    const inner = $(slot), el = $(sec);
    el.style.zoom = '';
    if (!wide.matches) return;
    let z = 1;
    while (inner.scrollHeight > inner.clientHeight + 1 && z > 0.6) {
      z -= 0.03;
      el.style.zoom = z.toFixed(2);
    }
  });
}
layout();
fitPages();
wide.addEventListener('change', () => { layout(); fitPages(); });
addEventListener('load', fitPages);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitPages);

// =====================================================
//  Shelf
// =====================================================
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const PALETTE = ['#1a1114','#201016','#2a0d16','#1d1418','#241519','#2b1519','#171316','#33191f','#2a1c17','#1f1620'];
const LABELS  = ['Velvet & Blood','His Ruin','Ruthless Oath','Bound by Sin','Crimson Hours','The Villain','Wicked Heart','Dark Vow','Masked Desire','Never Tame','Hunt Me Down','Sinful Games','Ashes & Roses','Thorn & Crown','Midnight Vow','Beautiful Ruin','Sworn to Him','Obsessed','Dangerous Men','My Dark King','Cruel Devotion','Possessive','Blood Oath','The Last Rose','Kiss of Ruin','Merciless','Hollow Crown','Black Orchid','His Alone','Lies & Lace','Dark Obsession','Scarlet Sins','Burn for Me','Mine to Keep','Cold Fire','Gilded Cage','Wicked Vows','Savage Heart','Wicked Bargain','Silk & Smoke','The Warlord','Forbidden','Breathless','Dark Heir','Wolf at Dusk','Her Villain','Reckless Vow','Poison Kiss','Bitter Crown','The Fallen King','Ruin Me','Velvet Cage','Iron & Rose','Blood Moon','A Cruel Love','Beloved Enemy'];

const pullBtn = $('pullBtn');
pullBtn.hidden = false;

function buildShelf(){
  const shelf = $('shelf');
  shelf.replaceChildren();
  const W = innerWidth, H = innerHeight;
  const rows = Math.max(3, Math.round(H / 190));
  const targetRow = Math.floor(rows / 2);
  const rnd = mulberry32(27112026);
  const labels = LABELS.slice();
  const usableH = H / rows - 14 - 12;

  for (let r = 0; r < rows; r++) {
    const row = document.createElement('div');
    row.className = 'row';
    if (labels.length < 14) labels.push(...LABELS.filter(l => !labels.includes(l)));   // keep every row supplied with titles
    const items = [];
    let used = 0;
    while (used < W * 0.96) {
      // books come in sets: same height, same colour family
      const run = 3 + Math.floor(rnd() * 5);
      const base = usableH * (0.68 + rnd() * 0.26);
      const c1 = PALETTE[Math.floor(rnd() * PALETTE.length)];
      const c2 = PALETTE[Math.floor(rnd() * PALETTE.length)];
      for (let k = 0; k < run && used < W * 0.96; k++) {
        const w = Math.round(24 + rnd() * 20);
        items.push({
          w, h: Math.round(base * (0.97 + rnd() * 0.06)),
          c: rnd() < 0.75 ? c1 : c2,
          gold: rnd() < 0.85,
          label: null
        });
        used += w + 1;
      }
    }
    items.forEach(it => {
      if (it.w >= 26 && labels.length && rnd() < 0.6) {
        for (let tries = 0; tries < 5 && !it.label; tries++) {
          const i = Math.floor(rnd() * labels.length);
          const need = labels[i].length * 7.7;       // px at the base size
          const avail = it.h * 0.84;
          if (avail >= need * 0.74) {                 // shrink long titles a little instead of dropping them
            it.label = labels.splice(i, 1)[0];
            it.fs = 0.8 * Math.min(1, avail / need);
            const r = rnd();
            it.tone = r < 0.45 ? 'g' : (r < 0.65 ? 'r' : '');
          }
        }
      }
    });
    if (r === targetRow) items.splice(Math.floor(items.length / 2), 0, { target: true });

    items.forEach(it => {
      if (it.target) {
        const th = Math.round(usableH * 0.97);
        pullBtn.style.height = th + 'px';
        const longest = Math.max(...spineLines.map(l => l.length));
        $('spineTitle').style.fontSize = Math.max(12, Math.min(19, (th * 0.74) / (longest * 0.58))) + 'px';
        row.append(pullBtn);
        return;
      }
      const s = document.createElement('div');
      s.className = 'spine' + (it.gold ? ' gold' : '');
      s.style.width = it.w + 'px';
      s.style.height = it.h + 'px';
      s.style.backgroundColor = it.c;
      s.setAttribute('aria-hidden', 'true');
      if (it.label) {
        const t = document.createElement('span');
        t.className = 't' + (it.tone ? ' ' + it.tone : '');
        t.textContent = it.label;
        t.style.fontSize = it.fs.toFixed(3) + 'rem';
        s.append(t);
      }
      row.append(s);
    });
    shelf.append(row);
  }
}
buildShelf();

let resizeTimer, lastW = innerWidth, lastH = innerHeight;
addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    setVh();
    if (innerWidth !== lastW || Math.abs(innerHeight - lastH) > 80) {
      lastW = innerWidth; lastH = innerHeight;
      buildShelf();
    }
    fitPages();
  }, 150);
});

// =====================================================
//  Pull the book: shelf → cover → open
// =====================================================
const scene = $('scene'), shelfEl = $('shelf'), book = $('book');
let state = 'shelf', timers = [];

function setState(s){
  state = s;
  scene.dataset.state = s;
  shelfEl.inert = (s !== 'shelf');
  book.inert = (s !== 'open');
}
setState('shelf');

function later(fn, ms){ timers.push(setTimeout(fn, ms)); }

function pull(){
  if (state !== 'shelf') return;
  startMusic();   // taking the book starts the song (user gesture)
  timers.forEach(clearTimeout);
  timers = [];
  scene.classList.remove('settled');
  if (reduceMotion) { setState('open'); scene.classList.add('settled'); book.focus({ preventScroll: true }); return; }
  setState('pulling');
  later(() => setState('cover'), 450);
  later(() => setState('open'), 1700);
  later(() => scene.classList.add('settled'), 3400);   // flip (1.6 s) is done -> draw the book flat
  later(() => book.focus({ preventScroll: true }), 3400);
}
function putBack(){
  timers.forEach(clearTimeout);
  timers = [];
  setState('shelf');
  later(() => scene.classList.remove('settled'), 900);   // keep it flat while the book fades out
  stopMusic();
  pullBtn.focus({ preventScroll: true });
}

pullBtn.addEventListener('click', pull);
$('backBtn').addEventListener('click', putBack);
addEventListener('keydown', e => { if (e.key === 'Escape' && state === 'open') putBack(); });

// =====================================================
//  Countdown
// =====================================================
const dd = $('dd'), hh = $('hh'), mm = $('mm'), ss = $('ss');
const pad = n => String(n).padStart(2, '0');

function setReleaseLine(text, label){
  const line = $('releaseLine');
  line.textContent = text + (label ? ' ' : '');
  if (label) {
    const s = document.createElement('span');
    s.textContent = label;
    line.append(s);
  }
}

if (!CONFIG.releaseAt) {
  $('telemetry').hidden = true;
  $('releaseLine').hidden = true;
} else {
  const target = new Date(CONFIG.releaseAt);
  setReleaseLine(CONFIG.releasePrefix, CONFIG.releaseLabel);

  const goLive = () => {
    clearInterval(timerId);
    const t = $('telemetry');
    if (t.classList.contains('is-live')) return;
    t.classList.add('is-live');
    t.removeAttribute('role');
    t.removeAttribute('aria-label');
    t.replaceChildren();
    const live = document.createElement('span');
    live.className = 't-live';
    live.textContent = CONFIG.liveText;
    t.append(live);
    setReleaseLine(CONFIG.liveReleaseLine, '');
  };
  const tick = () => {
    const diff = target - new Date();
    if (isNaN(diff)) return;
    if (diff <= 0) { goLive(); return; }
    dd.textContent = pad(Math.floor(diff / 86400000));
    hh.textContent = pad(Math.floor((diff % 86400000) / 3600000));
    mm.textContent = pad(Math.floor((diff % 3600000) / 60000));
    ss.textContent = pad(Math.floor((diff % 60000) / 1000));
  };
  // created BEFORE the first tick(), so clearInterval also works if the date has already passed on load
  const timerId = setInterval(tick, 1000);
  tick();
}

// =====================================================
//  Ambience button
// =====================================================
const music = $('bgMusic'), btn = $('musicBtn');
const MUSIC_VOL = 0.65;
let fadeId;
music.volume = 0;

function fadeTo(v, ms, done){
  clearInterval(fadeId);
  if (reduceMotion || ms <= 0) { music.volume = v; if (done) done(); return; }
  const from = music.volume, t0 = performance.now();
  fadeId = setInterval(() => {
    const k = Math.min(1, (performance.now() - t0) / ms);
    music.volume = from + (v - from) * k;
    if (k >= 1) { clearInterval(fadeId); if (done) done(); }
  }, 50);
}
async function startMusic(){
  if (!music.paused) return;
  clearInterval(fadeId);
  music.volume = 0;
  try { await music.play(); fadeTo(MUSIC_VOL, 2500); } catch { /* autoplay blocked: button stays on "Play song" */ }
}
function stopMusic(){
  if (music.paused) return;
  fadeTo(0, 800, () => music.pause());
}
music.addEventListener('play',  () => { btn.textContent = 'Mute'; });
music.addEventListener('pause', () => { btn.textContent = 'Play song'; });
btn.addEventListener('click', () => { music.paused ? startMusic() : stopMusic(); });
</script>

</body>
</html>
